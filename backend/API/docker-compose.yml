# API Verificación Documentos - ejecutar desde backend/API: docker compose up -d

services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc_verificacion_api
    ports:
      - "8000:8000"
    environment:
      TESSERACT_CMD: /usr/bin/tesseract
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/doc_verificacion
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - doc_net

  db:
    image: postgres:16-alpine
    container_name: doc_verificacion_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: doc_verificacion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - doc_net

  redis:
    image: redis:7-alpine
    container_name: doc_verificacion_redis
    ports:
      - "6379:6379"
    networks:
      - doc_net

volumes:
  postgres_data:

networks:
  doc_net:
    driver: bridge
