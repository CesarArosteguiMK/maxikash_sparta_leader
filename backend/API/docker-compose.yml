# API Verificación Documentos - ejecutar desde backend/API: docker compose up -d
# Solo el servicio API (PostgreSQL/Redis no son usados por el código actual).

services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc_verificacion_api
    ports:
      - "8001:8001"
    environment:
      TESSERACT_CMD: /usr/bin/tesseract
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
