; Mapeo: nombre del campo en el PDF (AcroForm) => clave del dato del candidato
; Para ver los nombres de los campos del PDF ejecuta: pdftk "solicitud_interna___SPARTA_SECRET_REDACTED___AcroForm.pdf" dump_data_fields
; y edita las claves de la izquierda para que coincidan con "FieldName" que aparezca.
; Claves de candidato: nombre_completo, nombres, apellidop, apellidom, email, telefono, puesto, departamento, fecha
; CURP: no se mapea aquí. Si el candidato tiene curp, se reparte automáticamente en curp_1, curp_2, ... curp_18 (cada carácter en su cuadro).
[campos]
nombre_completo = nombre_completo
email = email
telefono = telefono
puesto = puesto
departamento = departamento
fecha = fecha
; Opcionales si tu PDF tiene más campos con estos nombres:
; nombres = nombres
; apellidop = apellidop
; apellidom = apellidom
