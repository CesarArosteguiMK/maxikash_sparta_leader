<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QA Leónidas v35</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #e9edf3;
            font: 14px system-ui, sans-serif;
        }
        #leonidasAssistant {
            width: 440px;
            height: 760px;
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            background:
                radial-gradient(circle at 50% 24%, rgba(255,255,255,.13) 0 22%, transparent 22.4%),
                linear-gradient(155deg, #38577d, #13233d);
            box-shadow: 0 18px 50px #25364d35;
        }
        [data-leonidas-canvas] { width: 100%; height: 100%; display: block; }
        output {
            position: fixed;
            top: 16px;
            left: 16px;
            padding: 8px 12px;
            border-radius: 8px;
            background: white;
            color: #18304f;
        }
    </style>
</head>
<body>
<section id="leonidasAssistant" class="is-appearance-preview-live">
    <canvas data-leonidas-canvas></canvas>
</section>
<output>Giro: <span id="rotation">0.000</span></output>
<script>
    const root = document.getElementById('leonidasAssistant');
    root._leonidasAppearance = {
        id: 'clasico',
        color_primario: '#A91E2C',
        color_secundario: '#6F4328',
        color_metal: '#D8B37B',
        casco_visible: true,
        pechera_visible: true,
        cabello_visible: true
    };
    const rotation = document.getElementById('rotation');
    setInterval(() => {
        rotation.textContent = root.dataset.leonidasPreviewRotation || '0.000';
    }, 80);
</script>
<script type="module" src="/assets/js/leonidas-3d.js?v=qa-visor-35"></script>
</body>
</html>
